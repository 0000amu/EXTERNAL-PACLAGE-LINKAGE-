```yaml
name: quality gateway implementation

on:
  push:
    branches:
      - main

jobs:

  run-python-code:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Run test code
        run: pytest --cov=calci --cov-report=term


  deploy-job:
    runs-on: ubuntu-latest
    needs: run-python-code

    steps:
      - name: Print message
        run: echo "deploying to production"
```